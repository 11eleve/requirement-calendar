<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>需求日历</title>
<style>
/* One visual system for the calendar, its time bands and the inspector. */
:root { color-scheme: light; }
html,body { margin:0; min-height:100%; background:#f5f7ff; }
#req-calendar-refined {
 --rf-canvas:#f5f7ff;
 --rf-bg:#fff;
 --rf-soft:#f4f7fc;
 --rf-text:#28334d;
 --rf-muted:#65718a;
 --rf-line:#dfe5f1;
 --rf-grid:#edf1f8;
 --rf-purple:#6842b9;
 --rf-purple-bg:#f2ebff;
 --rf-purple-stage:#e5d6fc;
 --rf-blue:#2367a4;
 --rf-blue-bg:#eaf5ff;
 --rf-blue-stage:#d3eaff;
 --rf-green:#1b7354;
 --rf-green-bg:#e8f8ef;
 --rf-green-stage:#cceedd;
 --rf-accent:var(--rf-purple);
 --rf-action:#7752d8;
 --rf-action-hover:#6841c6;
 --rf-on-action:#fff;
 --rf-shadow:inset 0 1px 0 #ffffffcc,0 2px 5px #334c8505,0 12px 32px #334c8506;
 --rf-inspector-width:384px;
 --rf-row-height:136px;
 --rf-weekday-height:35px;
 --rf-remove-size:24px;
 --rf-ease:cubic-bezier(.22,.7,.25,1);
 display:flex; flex-direction:column; height:100vh; min-height:0; overflow:hidden;
 font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:var(--rf-text); background:var(--rf-canvas); -webkit-font-smoothing:antialiased;
}
#req-calendar-refined * { box-sizing:border-box; }
#req-calendar-refined button,#req-calendar-refined input,#req-calendar-refined textarea { font:inherit; color:inherit; }
#req-calendar-refined button { border:0; background:transparent; cursor:default; }
#req-calendar-refined button:disabled { opacity:.42; }
#req-calendar-refined :is(button,summary,a):focus-visible { outline:2px solid var(--rf-accent); outline-offset:2px; }
#req-calendar-refined [hidden] { display:none!important; }
#req-calendar-refined :is(h2,h3,p) { margin:0; }
#req-calendar-refined h3 { font-size:12px; font-weight:600; }
#req-calendar-refined .rf-muted { color:var(--rf-muted); font-size:11px; }
#req-calendar-refined .rf-chrome { flex:none; padding:12px 22px 0; color:var(--rf-muted); font-size:11px; }
html.native #req-calendar-refined .rf-chrome { display:none; }

/* A small centered date, with month navigation at opposite edges. */
#req-calendar-refined .rf-toolbar { flex:none; display:grid; grid-template-columns:40px minmax(0,1fr) 40px; align-items:center; gap:12px; padding:14px 22px; }
#req-calendar-refined #rf-title { display:flex; justify-content:center; align-items:baseline; gap:7px; min-width:0; white-space:nowrap; font-weight:500; line-height:1.2; letter-spacing:0; }
#req-calendar-refined .rf-month-year { color:var(--rf-muted); font-size:12px; font-weight:450; letter-spacing:.3px; }
#req-calendar-refined .rf-month-name { font-size:18px; font-weight:550; letter-spacing:-.3px; }
#req-calendar-refined .rf-month-jump { padding:3px 6px; border-radius:7px; }
#req-calendar-refined .rf-month-jump:hover { background:var(--rf-bg); }
#req-calendar-refined .rf-month-jump:active { background:var(--rf-soft); }
#req-calendar-refined :is(.rf-arrow,.rf-close) { display:grid; place-items:center; width:28px; height:28px; padding:0; border-radius:6px; }
#req-calendar-refined svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
#req-calendar-refined .rf-arrow { color:var(--rf-muted); justify-self:start; }
#req-calendar-refined #rf-next { justify-self:end; }
#req-calendar-refined :is(.rf-arrow,.rf-close):hover { color:var(--rf-text); background:var(--rf-soft); }
#req-calendar-refined :is(.rf-arrow,.rf-close):active { background:var(--rf-line); }
#req-calendar-refined .rf-button { min-height:30px; padding:5px 12px; font-size:12px; font-weight:500; border:1px solid var(--rf-line); border-radius:8px; background:var(--rf-bg); box-shadow:0 1px 2px #00000004; }
#req-calendar-refined .rf-button:hover { border-color:color-mix(in srgb,var(--rf-accent) 32%,var(--rf-line)); }
#req-calendar-refined .rf-primary { color:var(--rf-on-action); background:var(--rf-action); border-color:var(--rf-action); box-shadow:inset 0 1px 0 #ffffff24,0 2px 4px #23302612; }
#req-calendar-refined .rf-primary:hover { background:var(--rf-action-hover); border-color:var(--rf-action-hover); }
#req-calendar-refined .rf-primary:active { box-shadow:inset 0 1px 3px #00000018; }
#req-calendar-refined .rf-content { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 0px; column-gap:0; align-items:start; margin:0 18px 18px; overflow:hidden; }
#req-calendar-refined.has-detail .rf-content { grid-template-columns:minmax(0,1fr) var(--rf-inspector-width); column-gap:14px; }

/* The calendar is a quiet sheet; bands carry the information and color. */
#req-calendar-refined .rf-calendar { display:flex; flex-direction:column; min-width:0; min-height:0; height:100%; overflow-y:auto; scrollbar-gutter:stable; scrollbar-width:thin; overscroll-behavior:contain; user-select:none; -webkit-user-select:none; background:var(--rf-bg); border:1px solid var(--rf-line); border-radius:12px; box-shadow:var(--rf-shadow); }
#req-calendar-refined .rf-weekdays { position:sticky; top:0; z-index:3; flex:none; height:var(--rf-weekday-height); display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); background:var(--rf-bg); border-bottom:1px solid var(--rf-grid); }
#req-calendar-refined .rf-weekdays span { padding:9px 12px; text-align:right; font-size:10px; font-weight:500; color:var(--rf-muted); letter-spacing:.6px; }
#req-calendar-refined .rf-weekdays span:nth-child(n+6) { color:var(--rf-muted); }
#req-calendar-refined .rf-week { position:relative; flex:1 0 auto; height:max(var(--rf-row-height),calc(54px + var(--rf-lanes) * 44px)); border-bottom:1px solid var(--rf-grid); }
html.native #req-calendar-refined .rf-week { height:auto; min-height:calc(54px + var(--rf-lanes) * 44px); }
#req-calendar-refined .rf-week:last-child { border-bottom:0; }
#req-calendar-refined .rf-days { position:absolute; inset:0; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); touch-action:none; }
#req-calendar-refined .rf-date { --rf-date-bg:var(--rf-bg); display:flex; align-items:flex-start; justify-content:flex-end; min-width:0; padding:0; border-right:1px solid var(--rf-grid); text-align:right; }
#req-calendar-refined .rf-date:last-child { border-right:0; }
#req-calendar-refined .rf-date:nth-child(n+6) { --rf-date-bg:#fafbff; background:var(--rf-date-bg); }
#req-calendar-refined .rf-date.outside { --rf-date-bg:var(--rf-soft); color:var(--rf-muted); background:var(--rf-date-bg); }
#req-calendar-refined .rf-date-label { position:sticky; top:var(--rf-weekday-height); z-index:2; display:flex; align-items:center; justify-content:flex-end; flex:none; width:100%; height:35px; padding:5px 9px; background:var(--rf-date-bg); scroll-margin-top:44px; scroll-margin-bottom:8px; }
#req-calendar-refined .rf-date:not(:last-child)>.rf-date-label { width:calc(100% + 1px); margin-right:-1px; border-right:1px solid var(--rf-grid); }
#req-calendar-refined .rf-date-number { display:grid; place-items:center; flex:none; width:25px; height:25px; border-radius:7px; font-size:12px; font-weight:450; font-variant-numeric:tabular-nums; }
#req-calendar-refined .rf-date:hover .rf-date-number { color:var(--rf-purple); }
#req-calendar-refined .rf-date:focus-visible { outline:0; }
#req-calendar-refined .rf-date:focus-visible .rf-date-number { outline:2px solid var(--rf-purple); outline-offset:-1px; }
#req-calendar-refined .rf-bars { position:relative; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:40px; gap:4px 0; padding-top:35px; pointer-events:none; }
#req-calendar-refined .rf-bar {
 --rf-tone:var(--rf-purple); --rf-fill:var(--rf-purple-bg); --rf-phase-fill:var(--rf-purple-stage);
 position:relative; display:flex; flex-direction:column; justify-content:center; min-width:0; margin:0 4px; padding:0;
 pointer-events:auto; touch-action:none; cursor:grab; text-align:left; color:var(--rf-tone); background:var(--rf-fill);
 border:1px solid color-mix(in srgb,var(--rf-tone) 16%,transparent); border-radius:6px; overflow:hidden;
}
#req-calendar-refined .rf-bar.blue { --rf-tone:var(--rf-blue); --rf-fill:var(--rf-blue-bg); --rf-phase-fill:var(--rf-blue-stage); }
#req-calendar-refined .rf-bar.green { --rf-tone:var(--rf-green); --rf-fill:var(--rf-green-bg); --rf-phase-fill:var(--rf-green-stage); }
#req-calendar-refined .rf-bar::before { content:''; position:absolute; inset:0 auto 0 0; width:2px; border-radius:2px; background:color-mix(in srgb,var(--rf-tone) 70%,transparent); }
#req-calendar-refined .rf-bar.continued-left { border-left-width:0; border-top-left-radius:0; border-bottom-left-radius:0; }
#req-calendar-refined .rf-bar.continued-left::before { display:none; }
#req-calendar-refined .rf-bar.continued-right { border-right-width:0; border-top-right-radius:0; border-bottom-right-radius:0; }
#req-calendar-refined .rf-bar.is-hovered,#req-calendar-refined .rf-calendar:has(.rf-bar:focus-visible) .rf-bar.is-focused { border-color:color-mix(in srgb,var(--rf-tone) 28%,transparent); box-shadow:0 1px 4px #26203508; }
#req-calendar-refined .rf-bar.is-selected { border-color:color-mix(in srgb,var(--rf-tone) 48%,transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rf-tone) 25%,transparent),0 1px 4px #5140780c; }
#req-calendar-refined .rf-bar.is-pressed { border-color:color-mix(in srgb,var(--rf-tone) 58%,transparent); background:color-mix(in srgb,var(--rf-tone) 4%,var(--rf-fill)); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rf-tone) 18%,transparent); }
#req-calendar-refined .rf-bar:focus-visible { outline-color:var(--rf-tone); outline-offset:1px; }
#req-calendar-refined.is-replanning .rf-calendar,#req-calendar-refined.is-replanning .rf-date,#req-calendar-refined.is-replanning .rf-bar { cursor:grabbing; }
#req-calendar-refined.is-replan-invalid .rf-calendar,#req-calendar-refined.is-replan-invalid .rf-date,#req-calendar-refined.is-replan-invalid .rf-bar { cursor:not-allowed; }
#req-calendar-refined .rf-bar.is-moving { opacity:.48; }
#req-calendar-refined .rf-bar-title { display:block; min-width:0; padding:2px 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; font-weight:550; line-height:18px; }
#req-calendar-refined .rf-phases { display:grid; grid-template-columns:repeat(var(--rf-days),minmax(0,1fr)); flex:none; width:100%; min-height:16px; margin-top:auto; }
#req-calendar-refined .rf-bar:not(.has-phases) .rf-phases { display:none; }
#req-calendar-refined .rf-phase { position:relative; display:block; min-width:0; height:16px; padding:0 8px 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; line-height:14px; background:color-mix(in srgb,var(--rf-phase-fill) 65%,var(--rf-fill)); border-left:1px solid color-mix(in srgb,var(--rf-tone) 12%,transparent); }
#req-calendar-refined .rf-phase.phase-alt { background:color-mix(in srgb,var(--rf-phase-fill) 45%,var(--rf-fill)); }
#req-calendar-refined .rf-phase::after { content:''; position:absolute; inset:auto 0 0; height:1px; background:currentColor; opacity:.2; }
#req-calendar-refined .rf-phase.is-current::after { opacity:.5; }
#req-calendar-refined .rf-phase:first-child { border-left:0; }
#req-calendar-refined .rf-phase.is-current { font-weight:650; background:var(--rf-phase-fill); }
#req-calendar-refined .rf-range-anchor { position:absolute; inset:0; padding-top:31px; z-index:2; pointer-events:none; }
#req-calendar-refined .rf-range-preview { position:sticky; top:calc(var(--rf-weekday-height) + 31px); height:3px; pointer-events:none; border-radius:2px; --rf-range-tone:var(--rf-purple); background:var(--rf-range-tone); opacity:0; transform:translateY(2px); }
#req-calendar-refined .rf-range-preview.blue { --rf-range-tone:var(--rf-blue); }
#req-calendar-refined .rf-range-preview.green { --rf-range-tone:var(--rf-green); }
#req-calendar-refined .rf-range-preview.is-visible { opacity:.75; transform:none; }
#req-calendar-refined .rf-range-preview.continues-left { border-top-left-radius:2px; border-bottom-left-radius:2px; }
#req-calendar-refined .rf-range-preview.continues-right { border-top-right-radius:2px; border-bottom-right-radius:2px; }

/* An inspector with a readable opening and purposeful grouping. */
#req-calendar-refined .rf-detail { --rf-context-tone:var(--rf-purple); --rf-context-fill:var(--rf-purple-bg); --rf-accent:var(--rf-context-tone); --rf-panel-surface:var(--rf-bg); position:relative; display:flex; flex-direction:column; align-self:stretch; height:100%; min-width:0; min-height:0; max-height:100%; background:var(--rf-panel-surface); border:1px solid var(--rf-line); border-radius:12px; box-shadow:var(--rf-shadow); overflow:hidden; }
#req-calendar-refined .rf-detail[data-tone=blue] { --rf-context-tone:var(--rf-blue); --rf-context-fill:var(--rf-blue-bg); --rf-action:var(--rf-blue); --rf-action-hover:#195b96; --rf-on-action:#fff; }
#req-calendar-refined .rf-detail[data-tone=green] { --rf-context-tone:var(--rf-green); --rf-context-fill:var(--rf-green-bg); --rf-action:var(--rf-green); --rf-action-hover:#116548; --rf-on-action:#fff; }
#req-calendar-refined .rf-detail:has(.rf-form) { --rf-panel-surface:var(--rf-bg); }
#req-calendar-refined .rf-detail-head { flex:none; display:flex; align-items:center; justify-content:space-between; min-height:49px; padding:10px 15px 10px 20px; border-bottom:1px solid var(--rf-grid); }
#req-calendar-refined #rf-panel-label { color:var(--rf-text); font-size:13px; font-weight:600; letter-spacing:0; }
#req-calendar-refined .rf-close { color:var(--rf-muted); width:25px; height:25px; }
#req-calendar-refined #rf-panel { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:18px 20px 0; scrollbar-width:thin; scrollbar-gutter:stable; overscroll-behavior:contain; }
#req-calendar-refined .rf-detail-title { font-size:24px; font-weight:580; line-height:1.35; letter-spacing:-.6px; overflow-wrap:anywhere; }
#req-calendar-refined .rf-meta { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:12px 0 10px; font-size:11px; font-variant-numeric:tabular-nums; }
#req-calendar-refined .rf-pill { color:var(--rf-muted); font-size:10px; }
#req-calendar-refined .rf-period { color:var(--rf-muted); font-size:12px; margin-right:2px; }
#req-calendar-refined .rf-state { max-width:100%; overflow-wrap:anywhere; display:inline-flex; align-items:center; gap:5px; padding:3px 7px; border-radius:5px; color:var(--rf-context-tone); background:var(--rf-context-fill); }
#req-calendar-refined .rf-state.is-inactive { color:var(--rf-muted); background:var(--rf-soft); }
#req-calendar-refined .rf-state.is-inactive::before { display:none; }
#req-calendar-refined .rf-state::before { flex:none; content:''; width:4px; height:4px; border-radius:50%; background:currentColor; }
#req-calendar-refined .rf-section { margin-top:20px; padding:16px 0 0; background:var(--rf-bg); border-top:1px solid var(--rf-grid); }
#req-calendar-refined .rf-section:first-child { margin-top:0; padding-top:12px; border-top:0; }
#req-calendar-refined .rf-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px; }
#req-calendar-refined .rf-text-button { padding:3px 0; color:var(--rf-accent); font-size:11px; font-weight:500; }
#req-calendar-refined .rf-text-button:hover { text-decoration:underline; text-underline-offset:3px; }
#req-calendar-refined .rf-phase-row { position:relative; display:flex; flex-wrap:wrap; align-items:flex-start; gap:2px 8px; padding:8px 0 8px 26px; font-size:12px; font-variant-numeric:tabular-nums; }
#req-calendar-refined .rf-phase-name { flex:1 1 220px; min-width:0; overflow-wrap:anywhere; }
#req-calendar-refined .rf-phase-period { flex:none; white-space:nowrap; }
#req-calendar-refined .rf-phase-row::before { content:''; position:absolute; top:14px; left:6px; width:7px; height:7px; border-radius:50%; background:var(--rf-line); }
#req-calendar-refined .rf-phase-row:not(:last-child)::after { content:''; position:absolute; top:24px; bottom:-10px; left:9px; width:1px; background:var(--rf-line); }
#req-calendar-refined .rf-phase-row.current { color:var(--rf-context-tone); }
#req-calendar-refined .rf-phase-row.current::before { background:var(--rf-context-tone); box-shadow:0 0 0 3px var(--rf-context-fill); }
#req-calendar-refined .rf-resource-row { display:flex; align-items:center; gap:9px; min-width:0; padding:9px 0; color:inherit; text-decoration:none; border-bottom:1px solid var(--rf-grid); }
#req-calendar-refined .rf-resource-row:last-child { border-bottom:0; padding-bottom:0; }
#req-calendar-refined .rf-resource-icon { display:grid; place-items:center; flex:none; width:28px; height:28px; border:1px solid color-mix(in srgb,var(--rf-purple) 10%,transparent); border-radius:7px; background:var(--rf-purple-bg); color:var(--rf-purple); font-size:12px; font-weight:650; box-shadow:inset 0 1px 0 #ffffff18; }
#req-calendar-refined .rf-resource-icon[data-kind="钉"] { background:var(--rf-blue-bg); color:var(--rf-blue); border-color:color-mix(in srgb,var(--rf-blue) 15%,transparent); }
#req-calendar-refined .rf-resource-icon[data-kind="F"] { background:#f8eee9; color:#ae6a4c; }
#req-calendar-refined .rf-resource-icon[data-kind="G"],#req-calendar-refined .rf-resource-icon[data-kind="码"] { background:var(--rf-soft); color:var(--rf-text); }
#req-calendar-refined .rf-resource-icon[data-site-icon=true] { background:#f8f8fa; border-color:var(--rf-line); }
#req-calendar-refined .rf-site-icon { width:18px; height:18px; object-fit:contain; }
#req-calendar-refined .rf-item-summary .rf-site-icon { width:14px; height:14px; }
#req-calendar-refined .rf-resource-symbol { width:18px; height:18px; stroke-width:1.6; }
#req-calendar-refined .rf-resource-symbol[data-filled=true] { fill:currentColor; stroke:none; }
#req-calendar-refined .rf-item-summary .rf-resource-symbol { width:14px; height:14px; }
#req-calendar-refined .rf-resource-text { flex:1; min-width:0; }
#req-calendar-refined .rf-resource-text strong { display:block; overflow-wrap:anywhere; font-size:12px; font-weight:550; }
#req-calendar-refined .rf-resource-text small { overflow-wrap:anywhere; display:block; margin-top:2px; font-size:11px; color:var(--rf-muted); }
#req-calendar-refined .rf-resource-row.is-link::after { content:'↗'; flex:none; font-size:13px; color:var(--rf-muted); }
#req-calendar-refined .rf-resource-row.is-link:hover strong { color:var(--rf-accent); }
#req-calendar-refined .rf-task { display:flex; align-items:flex-start; gap:8px; padding:7px 0; font-size:12px; }
#req-calendar-refined .rf-task span { min-width:0; overflow-wrap:anywhere; }
#req-calendar-refined input[type=checkbox] { accent-color:var(--rf-accent); width:13px; height:13px; margin:2px 0 0; flex:none; }
#req-calendar-refined .rf-task:has(input:checked) span { color:var(--rf-muted); text-decoration:line-through; }
#req-calendar-refined .rf-note { color:var(--rf-muted); font-size:12px; line-height:1.75; white-space:pre-wrap; overflow-wrap:anywhere; }
#req-calendar-refined .rf-detail-actions { position:sticky; bottom:0; z-index:2; flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; padding:14px 0 16px; border-top:1px solid var(--rf-line); background:var(--rf-panel-surface); box-shadow:0 16px 0 var(--rf-panel-surface); }
#req-calendar-refined .rf-section :is(a,button,input) { scroll-margin-top:8px; scroll-margin-bottom:58px; }
#req-calendar-refined .rf-destructive { color:#a55662; font-weight:400; }

/* One continuous editor fills the available height; only its body scrolls. */
#req-calendar-refined .rf-form { display:flex; flex-direction:column; gap:0; min-height:100%; padding-bottom:80px; }
#req-calendar-refined .rf-form>section { flex:none; min-width:0; }
#req-calendar-refined .rf-editor-basics { display:grid; gap:12px; padding-bottom:12px; }
#req-calendar-refined .rf-field { display:grid; gap:5px; min-width:0; color:var(--rf-muted); font-size:11px; font-weight:500; }
#req-calendar-refined .rf-field :is(input,textarea) { width:100%; min-width:0; min-height:34px; padding:7px 9px; color:var(--rf-text); background:var(--rf-soft); border:1px solid var(--rf-line); border-radius:8px; box-shadow:inset 0 1px 0 #ffffff80,0 1px 2px #00000002; font-size:12px; font-weight:400; }
#req-calendar-refined .rf-field :is(input,textarea):focus { outline:none; border-color:color-mix(in srgb,var(--rf-accent) 55%,var(--rf-line)); box-shadow:0 0 0 3px color-mix(in srgb,var(--rf-accent) 11%,transparent); }
#req-calendar-refined .rf-field input::placeholder,#req-calendar-refined textarea::placeholder { color:var(--rf-muted); opacity:1; }
#req-calendar-refined .rf-title-field input { min-height:40px; padding:5px 0 9px; background:transparent; border:0; border-bottom:1px solid var(--rf-line); border-radius:0; box-shadow:none; font-size:18px; font-weight:580; letter-spacing:-.3px; }
#req-calendar-refined .rf-title-field input:focus { border-bottom-color:var(--rf-accent); box-shadow:0 1px 0 var(--rf-accent); }

  const VERSION = 7;

    {id:'blue',name:'晴空蓝',color:'#2367a4',fill:'#eaf5ff',stage:'#d3eaff'},
    {id:'green',name:'薄荷绿',color:'#1b7354',fill:'#e8f8ef',stage:'#cceedd'},
    {id:'amber',name:'琥珀黄',color:'#8a590b',fill:'#fff7dc',stage:'#f9e7ae'},
    {id:'rose',name:'蔷薇粉',color:'#a13b65',fill:'#fff0f5',stage:'#f7d7e5'},
    {id:'teal',name:'湖水青',color:'#167579',fill:'#e8f8f8',stage:'#c9eceb'},
    {id:'orange',name:'杏子橙',color:'#a64e22',fill:'#fff2e8',stage:'#faddc8'},
    {id:'slate',name:'雾霭灰',color:'#53627b',fill:'#f0f3f8',stage:'#dce3ef'}

  const NODE_KINDS = Object.freeze([
    {id:'review',name:'评审',symbol:'◇'}, {id:'release',name:'发布',symbol:'⚑'},

  function allocateLanes(items, start, end, preferred = null) {

    // Keeping a high old row must not reserve empty rows for the whole month.
    const peakEnds=[];

    const count=peakEnds.length,mapping=Object.create(null),ends=Array(count).fill(null);

    visible.sort((a,b)=>clippedStart(a).localeCompare(clippedStart(b))||Number(previousLane(b)>=0)-Number(previousLane(a)>=0)||compare(a,b));

    if (matches('figma.com')) return 'F';
    if (matches('github.com') || matches('gitlab.com')) return 'G';
    return /设计|交互/.test(type) ? '稿' : /代码|接口/.test(type) ? '码' : '文';
  }
  function requirement(value) {

    if (!Array.isArray(value.phases)) throw new ValidationError('阶段数据无效。', '阶段');
    const phases = value.phases.map((phase, index) => {
      if (!phase || typeof phase !== 'object') throw new ValidationError('阶段数据无效。', '阶段');
      const name = text(phase.name, '阶段名称', true);
      if (!validDate(phase.start) || !validDate(phase.end) || phase.end < phase.start || phase.start < value.start || phase.end > value.end) throw new ValidationError('阶段日期需要落在需求周期内。', '阶段.' + index);

    const resources = value.resources.map(resource => {
      if (!resource || typeof resource !== 'object') throw new ValidationError('资料数据无效。', '资料');
      const name = text(resource.name, '资料名称', true), type = text(resource.type ?? '', '资料类型'), url = safeURL(resource.url ?? '');

    if (!Array.isArray(sourceNodes)) throw new ValidationError('时间节点数据无效。', '时间节点');
    const nodeIds = new Set();
    const milestones = sourceNodes.map(node => {
      if (!node || typeof node !== 'object') throw new ValidationError('时间节点数据无效。', '时间节点');

      if (nodeIds.has(id)) throw new ValidationError('时间节点标识重复。', '时间节点');
      nodeIds.add(id);
      if (!validDate(node.date) || node.date < value.start || node.date > value.end) throw new ValidationError('时间节点须落在需求周期内。', '时间节点');

      return {id, name, date: node.date, kind: node.kind, done: node.done ?? false};
    }).sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));

    if (reminder !== null && !validReminder(reminder)) throw new ValidationError('提醒时间无效。', '提醒');

  }
  function snapshot(value) {
    if (!value || typeof value !== 'object' || Array.isArray(value)) throw new ValidationError('保存的数据格式无效。');

    if (!Number.isInteger(offset)) throw new ValidationError('日期偏移需要是整数。');

  }

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else scope.CalendarModel = api;
})(globalThis);
