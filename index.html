<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>需求日历</title>
<style>
/* One visual system for the calendar, its time bands and the inspector. */
:root { color-scheme: light dark; }
html,body { margin:0; min-height:100%; background:light-dark(#f5f5f8,#191b20); }
#req-calendar-refined {
 --rf-canvas:light-dark(#f5f5f8,#191b20);
 --rf-bg:light-dark(#fff,#24262d);
 --rf-soft:light-dark(#f8f8fb,#202229);
 --rf-text:light-dark(#30313e,#edeef5);
 --rf-muted:light-dark(#6c6e80,#a3a6b9);
 --rf-line:light-dark(#e7e7ee,#343741);
 --rf-grid:light-dark(#eeedf3,#2c2f38);
 --rf-purple:light-dark(#63529e,#c4b5f4);
 --rf-purple-bg:light-dark(#f0ecfa,#342e49);
 --rf-purple-stage:light-dark(#e5def4,#43385d);
 --rf-blue:light-dark(#41648c,#b0cceb);
 --rf-blue-bg:light-dark(#eaf1f9,#28394c);
 --rf-blue-stage:light-dark(#dae7f5,#354c66);
 --rf-green:light-dark(#346e60,#a3d5c5);
 --rf-green-bg:light-dark(#eaf4ef,#293d35);
 --rf-green-stage:light-dark(#d8ebe2,#375447);
 --rf-shadow:0 2px 8px light-dark(#27213b04,#0000000f),0 0 0 1px light-dark(#27213b03,#ffffff02);
 --rf-inspector-width:352px;
 --rf-row-height:136px;
 --rf-ease:cubic-bezier(.22,.7,.25,1);
 display:flex; flex-direction:column; height:100vh; min-height:0; overflow:hidden;
 font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:var(--rf-text); background:var(--rf-canvas); -webkit-font-smoothing:antialiased;
}
#req-calendar-refined * { box-sizing:border-box; }
#req-calendar-refined button,#req-calendar-refined input,#req-calendar-refined textarea { font:inherit; color:inherit; }
#req-calendar-refined button { border:0; background:transparent; cursor:default; }
#req-calendar-refined button:disabled { opacity:.42; }
#req-calendar-refined :is(button,summary,a):focus-visible { outline:2px solid var(--rf-purple); outline-offset:2px; }
#req-calendar-refined [hidden] { display:none!important; }
#req-calendar-refined :is(h2,h3,p) { margin:0; }
#req-calendar-refined h3 { font-size:12px; font-weight:600; }
#req-calendar-refined .rf-muted { color:var(--rf-muted); font-size:11px; }
#req-calendar-refined .rf-chrome { flex:none; padding:12px 22px 0; color:var(--rf-muted); font-size:11px; }
html.native #req-calendar-refined .rf-chrome { display:none; }

/* A composed toolbar: the date has two weights, navigation one quiet enclosure. */
#req-calendar-refined .rf-toolbar { flex:none; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:19px 24px 17px; }
#req-calendar-refined .rf-controls { display:flex; align-items:center; gap:22px; min-width:0; }
#req-calendar-refined #rf-title { display:flex; align-items:baseline; gap:8px; white-space:nowrap; font-weight:600; line-height:1.2; letter-spacing:-.5px; }
#req-calendar-refined .rf-month-year { color:var(--rf-muted); font-size:14px; font-weight:450; letter-spacing:0; }
#req-calendar-refined .rf-month-name { font-size:25px; }
#req-calendar-refined .rf-month-navigation { display:flex; padding:2px; gap:2px; background:var(--rf-bg); border:1px solid var(--rf-line); border-radius:9px; box-shadow:0 1px 2px #00000003; }
#req-calendar-refined :is(.rf-arrow,.rf-close,.rf-add) { display:grid; place-items:center; width:28px; height:28px; padding:0; border-radius:6px; }
#req-calendar-refined svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
#req-calendar-refined .rf-arrow { color:var(--rf-muted); }
#req-calendar-refined :is(.rf-arrow,.rf-close):hover { color:var(--rf-text); background:var(--rf-soft); }
#req-calendar-refined :is(.rf-arrow,.rf-close):active { background:var(--rf-line); }
#req-calendar-refined .rf-button { min-height:30px; padding:5px 12px; font-size:12px; font-weight:500; border:1px solid var(--rf-line); border-radius:7px; background:var(--rf-bg); box-shadow:0 1px 2px #00000004; }
#req-calendar-refined .rf-button:hover { border-color:color-mix(in srgb,var(--rf-purple) 32%,var(--rf-line)); }
#req-calendar-refined .rf-primary { color:light-dark(#fff,#24202f); background:light-dark(#7562b2,#bba9ed); border-color:light-dark(#6955a8,#bba9ed); box-shadow:inset 0 1px 0 #ffffff24,0 2px 4px #51407812; }
#req-calendar-refined .rf-primary:hover { background:light-dark(#6956a6,#c7b8f3); }
#req-calendar-refined .rf-primary:active { box-shadow:inset 0 1px 3px #00000018; }
#req-calendar-refined .rf-add { width:32px; height:32px; padding:0; border-radius:9px; }
#req-calendar-refined .rf-add svg { width:19px; height:19px; }
#req-calendar-refined .rf-content { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 0px; column-gap:0; align-items:start; margin:0 18px 18px; overflow:hidden; }
#req-calendar-refined.has-detail .rf-content { grid-template-columns:minmax(0,1fr) var(--rf-inspector-width); column-gap:14px; }

/* The calendar is a quiet sheet; bands carry the information and color. */
#req-calendar-refined .rf-calendar { display:flex; flex-direction:column; min-width:0; min-height:0; height:100%; overflow-y:auto; scrollbar-gutter:stable; scrollbar-width:thin; overscroll-behavior:contain; user-select:none; -webkit-user-select:none; background:var(--rf-bg); border:1px solid var(--rf-line); border-radius:12px; box-shadow:var(--rf-shadow); }
#req-calendar-refined .rf-weekdays { position:sticky; top:0; z-index:3; flex:none; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); background:var(--rf-bg); border-bottom:1px solid var(--rf-grid); }
#req-calendar-refined .rf-weekdays span { padding:9px 12px; text-align:right; font-size:10.5px; font-weight:500; color:var(--rf-muted); letter-spacing:.4px; }
#req-calendar-refined .rf-weekdays span:nth-child(n+6) { color:color-mix(in srgb,var(--rf-purple) 60%,var(--rf-muted)); }
#req-calendar-refined .rf-week { position:relative; flex:1 0 auto; height:max(var(--rf-row-height),calc(54px + var(--rf-lanes) * 44px)); border-bottom:1px solid var(--rf-grid); }
html.native #req-calendar-refined .rf-week { height:auto; min-height:calc(54px + var(--rf-lanes) * 44px); }
#req-calendar-refined .rf-week:last-child { border-bottom:0; }
#req-calendar-refined .rf-days { position:absolute; inset:0; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); touch-action:none; }
#req-calendar-refined .rf-date { display:flex; align-items:flex-start; justify-content:flex-end; min-width:0; padding:5px 9px; border-right:1px solid var(--rf-grid); text-align:right; }
#req-calendar-refined .rf-date:last-child { border-right:0; }
#req-calendar-refined .rf-date:nth-child(n+6) { background:light-dark(#fcfbfe,#23252c); }
#req-calendar-refined .rf-date.outside { color:var(--rf-muted); background:var(--rf-soft); }
#req-calendar-refined .rf-date span { display:grid; place-items:center; width:25px; height:25px; border-radius:7px; font-size:12px; font-weight:450; font-variant-numeric:tabular-nums; scroll-margin-top:44px; scroll-margin-bottom:8px; }
#req-calendar-refined .rf-date:hover span { color:var(--rf-purple); }
#req-calendar-refined .rf-date:focus-visible { outline:0; }
#req-calendar-refined .rf-date:focus-visible span { outline:2px solid var(--rf-purple); outline-offset:-1px; }
#req-calendar-refined .rf-bars { position:relative; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:38px; gap:6px 0; padding-top:35px; pointer-events:none; }
#req-calendar-refined .rf-bar {
 --rf-tone:var(--rf-purple); --rf-fill:var(--rf-purple-bg); --rf-phase-fill:var(--rf-purple-stage);
 position:relative; display:flex; flex-direction:column; justify-content:center; min-width:0; margin:0 4px; padding:0;
 pointer-events:auto; text-align:left; color:var(--rf-tone); background:linear-gradient(120deg,color-mix(in srgb,var(--rf-fill) 90%,var(--rf-bg)),var(--rf-fill));
 border:1px solid color-mix(in srgb,var(--rf-tone) 12%,transparent); border-radius:7px; overflow:hidden; box-shadow:0 1px 2px #26203506;
}
#req-calendar-refined .rf-bar.blue { --rf-tone:var(--rf-blue); --rf-fill:var(--rf-blue-bg); --rf-phase-fill:var(--rf-blue-stage); }
#req-calendar-refined .rf-bar.green { --rf-tone:var(--rf-green); --rf-fill:var(--rf-green-bg); --rf-phase-fill:var(--rf-green-stage); }
#req-calendar-refined .rf-bar::before { content:''; position:absolute; inset:5px auto 5px 0; width:2px; border-radius:2px; background:color-mix(in srgb,var(--rf-tone) 55%,transparent); }
#req-calendar-refined .rf-bar.continued-left { border-top-left-radius:3px; border-bottom-left-radius:3px; }
#req-calendar-refined .rf-bar.continued-left::before { display:none; }
#req-calendar-refined .rf-bar.continued-right { border-top-right-radius:3px; border-bottom-right-radius:3px; }
#req-calendar-refined .rf-bar:hover { border-color:color-mix(in srgb,var(--rf-tone) 32%,transparent); box-shadow:0 2px 5px #2620350b; }
#req-calendar-refined .rf-bar.is-selected { border-color:color-mix(in srgb,var(--rf-tone) 48%,transparent); box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--rf-tone) 25%,transparent),0 1px 4px #5140780c; }
#req-calendar-refined .rf-bar-title { display:block; min-width:0; padding:2px 9px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; font-weight:600; line-height:17px; }
#req-calendar-refined .rf-phases { display:grid; grid-template-columns:repeat(var(--rf-days),minmax(0,1fr)); flex:none; width:100%; min-height:15px; margin-top:auto; }
#req-calendar-refined .rf-bar:not(.has-phases) .rf-phases { display:none; }
#req-calendar-refined .rf-phase { display:block; min-width:0; padding:0 7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; line-height:15px; background:var(--rf-phase-fill); border-left:1px solid color-mix(in srgb,var(--rf-bg) 55%,transparent); }
#req-calendar-refined .rf-phase.phase-alt { background:color-mix(in srgb,var(--rf-phase-fill) 70%,var(--rf-fill)); }
#req-calendar-refined .rf-phase:first-child { border-left:0; }
#req-calendar-refined .rf-phase.is-current { font-weight:650; }
#req-calendar-refined .rf-range-preview { position:absolute; bottom:6px; height:8px; z-index:1; pointer-events:none; border-radius:4px; --rf-range-tone:var(--rf-purple); background:linear-gradient(90deg,var(--rf-range-tone),color-mix(in srgb,var(--rf-range-tone) 70%,var(--rf-bg))); opacity:0; transform:translateY(2px); }
#req-calendar-refined .rf-range-preview.blue { --rf-range-tone:var(--rf-blue); }
#req-calendar-refined .rf-range-preview.green { --rf-range-tone:var(--rf-green); }
#req-calendar-refined .rf-range-preview.is-visible { opacity:.48; transform:none; }
#req-calendar-refined .rf-range-preview.continues-left { border-top-left-radius:2px; border-bottom-left-radius:2px; }
#req-calendar-refined .rf-range-preview.continues-right { border-top-right-radius:2px; border-bottom-right-radius:2px; }

/* An inspector with a readable opening and purposeful grouping. */
#req-calendar-refined .rf-detail { display:flex; flex-direction:column; align-self:start; min-width:0; min-height:0; max-height:100%; background:var(--rf-soft); border:1px solid var(--rf-line); border-radius:12px; box-shadow:var(--rf-shadow); overflow:hidden; }
#req-calendar-refined .rf-detail-head { flex:none; display:flex; align-items:center; justify-content:space-between; padding:9px 13px 9px 17px; border-bottom:1px solid var(--rf-line); }
#req-calendar-refined #rf-panel-label { color:var(--rf-muted); font-size:11px; font-weight:500; letter-spacing:.3px; }
#req-calendar-refined .rf-close { color:var(--rf-muted); width:25px; height:25px; }
#req-calendar-refined #rf-panel { min-height:0; overflow-y:auto; overflow-x:hidden; padding:16px; scrollbar-width:thin; scrollbar-gutter:stable; overscroll-behavior:contain; }
#req-calendar-refined .rf-detail-title { font-size:21px; font-weight:600; line-height:1.4; letter-spacing:-.5px; overflow-wrap:anywhere; }
#req-calendar-refined .rf-meta { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:10px 0 18px; font-size:11px; font-variant-numeric:tabular-nums; }
#req-calendar-refined .rf-pill { color:var(--rf-muted); font-size:10px; }
#req-calendar-refined .rf-period { color:var(--rf-muted); font-size:12px; margin-right:2px; }
#req-calendar-refined .rf-state { max-width:100%; overflow-wrap:anywhere; display:inline-flex; align-items:center; gap:5px; padding:3px 7px; border-radius:5px; color:var(--rf-purple); background:var(--rf-purple-bg); }
#req-calendar-refined .rf-state::before { flex:none; content:''; width:4px; height:4px; border-radius:50%; background:currentColor; }
#req-calendar-refined .rf-section { margin-top:12px; padding:12px; background:var(--rf-bg); border:1px solid var(--rf-line); border-radius:9px; }
#req-calendar-refined .rf-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px; }
#req-calendar-refined .rf-text-button { padding:3px 0; color:var(--rf-purple); font-size:11px; font-weight:500; }
#req-calendar-refined .rf-text-button:hover { text-decoration:underline; text-underline-offset:3px; }
#req-calendar-refined .rf-phase-row { position:relative; display:flex; flex-wrap:wrap; align-items:flex-start; gap:2px 8px; padding:8px 0 8px 16px; font-size:11px; font-variant-numeric:tabular-nums; }
#req-calendar-refined .rf-phase-name { flex:1 1 180px; min-width:0; overflow-wrap:anywhere; }
#req-calendar-refined .rf-phase-period { flex:none; white-space:nowrap; }
#req-calendar-refined .rf-phase-row::before { content:''; position:absolute; top:14px; left:2px; width:5px; height:5px; border-radius:50%; background:var(--rf-line); }
#req-calendar-refined .rf-phase-row:not(:last-child)::after { content:''; position:absolute; top:22px; bottom:-10px; left:4px; width:1px; background:var(--rf-line); }
#req-calendar-refined .rf-phase-row.current { color:var(--rf-purple); }
#req-calendar-refined .rf-phase-row.current::before { background:var(--rf-purple); box-shadow:0 0 0 3px var(--rf-purple-bg); }
#req-calendar-refined .rf-resource-row { display:flex; align-items:center; gap:9px; min-width:0; padding:9px 0; color:inherit; text-decoration:none; border-bottom:1px solid var(--rf-grid); }
#req-calendar-refined .rf-resource-row:last-child { border-bottom:0; padding-bottom:0; }
#req-calendar-refined .rf-resource-icon { display:grid; place-items:center; flex:none; width:28px; height:28px; border:1px solid color-mix(in srgb,var(--rf-purple) 10%,transparent); border-radius:7px; background:var(--rf-purple-bg); color:var(--rf-purple); font-size:12px; font-weight:650; box-shadow:inset 0 1px 0 #ffffff18; }
#req-calendar-refined .rf-resource-icon[data-kind="钉"] { background:var(--rf-blue-bg); color:var(--rf-blue); border-color:color-mix(in srgb,var(--rf-blue) 15%,transparent); }
#req-calendar-refined .rf-resource-icon[data-kind="F"] { background:light-dark(#f8eee9,#43352f); color:light-dark(#ae6a4c,#efb697); }
#req-calendar-refined .rf-resource-icon[data-kind="G"],#req-calendar-refined .rf-resource-icon[data-kind="码"] { background:var(--rf-soft); color:var(--rf-text); }
#req-calendar-refined .rf-resource-icon[data-site-icon=true] { background:#f8f8fa; border-color:var(--rf-line); }
#req-calendar-refined .rf-site-icon { width:18px; height:18px; object-fit:contain; }
#req-calendar-refined .rf-item-summary .rf-site-icon { width:14px; height:14px; }
#req-calendar-refined .rf-resource-symbol { width:18px; height:18px; stroke-width:1.6; }
#req-calendar-refined .rf-resource-symbol[data-filled=true] { fill:currentColor; stroke:none; }
#req-calendar-refined .rf-item-summary .rf-resource-symbol { width:14px; height:14px; }
#req-calendar-refined .rf-resource-text { flex:1; min-width:0; }
#req-calendar-refined .rf-resource-text strong { display:block; overflow-wrap:anywhere; font-size:12px; font-weight:550; }
#req-calendar-refined .rf-resource-text small { overflow-wrap:anywhere; display:block; margin-top:2px; font-size:10px; color:var(--rf-muted); }
#req-calendar-refined .rf-resource-row.is-link::after { content:'↗'; flex:none; font-size:13px; color:var(--rf-muted); }
#req-calendar-refined .rf-resource-row.is-link:hover strong { color:var(--rf-purple); }
#req-calendar-refined .rf-task { display:flex; align-items:flex-start; gap:8px; padding:7px 0; font-size:11px; }
#req-calendar-refined .rf-task span { min-width:0; overflow-wrap:anywhere; }
#req-calendar-refined input[type=checkbox] { accent-color:var(--rf-purple); width:13px; height:13px; margin:2px 0 0; flex:none; }
#req-calendar-refined .rf-task:has(input:checked) span { color:var(--rf-muted); text-decoration:line-through; }
#req-calendar-refined .rf-note { color:var(--rf-muted); font-size:11px; line-height:1.75; white-space:pre-wrap; overflow-wrap:anywhere; }
#req-calendar-refined .rf-detail-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; }
#req-calendar-refined .rf-destructive { color:light-dark(#a55662,#eca4b1); font-weight:400; }

/* Compact editing with a typographic title, small surfaces and a stable footer. */
#req-calendar-refined .rf-form { display:flex; flex-direction:column; gap:14px; min-height:0; }
#req-calendar-refined .rf-editor-tabs { position:sticky; top:-16px; z-index:3; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); flex:none; gap:3px; padding:3px; background:var(--rf-line); border-radius:8px; box-shadow:0 -16px 0 var(--rf-soft),0 7px 0 var(--rf-soft); }
#req-calendar-refined .rf-editor-tab { min-width:0; padding:6px 5px; border-radius:5px; font-size:11px; font-weight:500; color:light-dark(#646678,var(--rf-muted)); }
#req-calendar-refined .rf-editor-tab[aria-selected=true] { color:var(--rf-text); background:var(--rf-bg); box-shadow:0 1px 3px #21203113; }
#req-calendar-refined .rf-tab-panel { display:flex; flex-direction:column; gap:12px; min-height:0; min-width:0; }
#req-calendar-refined .rf-field { display:grid; gap:5px; min-width:0; color:var(--rf-muted); font-size:11px; font-weight:500; }
#req-calendar-refined .rf-field :is(input,textarea) { width:100%; min-width:0; min-height:34px; padding:7px 9px; color:var(--rf-text); background:var(--rf-bg); border:1px solid var(--rf-line); border-radius:7px; box-shadow:0 1px 2px #00000002; font-size:12px; font-weight:400; }
#req-calendar-refined .rf-field :is(input,textarea):focus { outline:none; border-color:color-mix(in srgb,var(--rf-purple) 55%,var(--rf-line)); box-shadow:0 0 0 3px color-mix(in srgb,var(--rf-purple) 11%,transparent); }
#req-calendar-refined .rf-field input::placeholder,#req-calendar-refined textarea::placeholder { color:var(--rf-muted); opacity:1; }
#req-calendar-refined .rf-tab-panel[data-editor-panel=basic]>.rf-field:first-child input { min-height:41px; padding:8px 10px; font-size:16px; font-weight:550; letter-spacing:-.2px; }
#req-calendar-refined .rf-field input[type=date] { padding:7px 5px; font-size:11px; font-variant-numeric:tabular-nums; }
#req-calendar-refined .rf-field input[type=datetime-local] { font-size:11px; font-variant-numeric:tabular-nums; }
#req-calendar-refined .rf-field textarea { min-height:78px; resize:vertical; line-height:1.65; }
#req-calendar-refined .rf-pair { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
#req-calendar-refined .rf-editor-section { padding:10px 11px; background:var(--rf-bg); border:1px solid var(--rf-line); border-radius:9px; }
#req-calendar-refined .rf-editor-section .rf-heading { margin-bottom:4px; }
#req-calendar-refined .rf-editor-item { position:relative; min-width:0; border-bottom:1px solid var(--rf-grid); }
#req-calendar-refined .rf-editor-item:last-child { border-bottom:0; }
#req-calendar-refined .rf-item-summary { display:flex; align-items:center; gap:7px; min-height:40px; padding:6px 31px 6px 0; font-size:11px; list-style:none; }
#req-calendar-refined .rf-item-summary::-webkit-details-marker { display:none; }
#req-calendar-refined .rf-item-summary::before { content:'›'; width:7px; flex:none; color:var(--rf-muted); font-size:15px; line-height:1; }
#req-calendar-refined details[open]>.rf-item-summary::before { transform:rotate(90deg); }
#req-calendar-refined .rf-item-summary .rf-resource-icon { width:22px; height:22px; border-radius:5px; font-size:10px; }
#req-calendar-refined .rf-summary-name { flex:1; min-width:0; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#req-calendar-refined .rf-summary-meta { flex:none; max-width:90px; font-size:10px; color:var(--rf-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#req-calendar-refined .rf-item-fields { display:grid; gap:9px; padding:5px 0 12px; }

#req-calendar-refined .rf-remove { padding:2px 0; font-size:10px; color:var(--rf-muted); }
#req-calendar-refined .rf-remove:hover { color:light-dark(#a55662,#eca4b1); }
