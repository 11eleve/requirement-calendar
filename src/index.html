<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>需求日历</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="req-calendar-refined" aria-label="需求长条与条内阶段日历">

<div class="rf-chrome"><span class="rf-app">需求日历</span></div>
<div class="rf-toolbar"><button type="button" class="rf-arrow cursor-interaction" id="rf-prev" aria-label="上个月"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg></button><h2 id="rf-title" aria-live="polite"></h2><button type="button" class="rf-arrow cursor-interaction" id="rf-next" aria-label="下个月"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg></button></div>
<p id="rf-reminder-status" class="rf-reminder-status" role="status" hidden></p>
<p id="rf-storage-error" class="rf-storage-error" role="alert" hidden></p>
<div class="rf-content"><main id="rf-calendar" class="rf-calendar" aria-label="需求与阶段日历"></main><aside id="rf-detail" class="rf-detail" aria-label="需求详情" hidden><div class="rf-detail-head"><span id="rf-panel-label" class="rf-muted">需求详情</span><button type="button" class="rf-close cursor-interaction" id="rf-close" aria-label="关闭详情"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8"/></svg></button></div><div id="rf-panel"></div></aside></div>
<span id="rf-feedback" class="rf-feedback" aria-live="polite"></span>
<div id="rf-toast" class="rf-toast" role="status" hidden><span id="rf-toast-text"></span><button id="rf-undo" type="button">撤销删除</button></div>
<dialog id="rf-discard" class="rf-dialog" aria-labelledby="rf-discard-title"><h2 id="rf-discard-title">保存对需求的更改？</h2><p>未保存的更改会在离开编辑器后丢失。</p><div class="rf-dialog-actions"><button id="rf-discard-drop" type="button">不保存</button><button id="rf-discard-keep" type="button" autofocus>继续编辑</button><button id="rf-discard-save" type="button">保存</button></div></dialog>

</div>

<script src="model.js"></script>
<script src="storage.js"></script>
<script src="icons.js"></script>
<script src="site-icons.js"></script>
<script src="disclosure.js"></script>
<script src="startup.js"></script>
<script src="app.js"></script>
</body>
</html>
