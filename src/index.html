<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>需求日历</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="req-calendar-refined" aria-label="需求长条与条内阶段日历">

<div class="rf-chrome"><span class="rf-app">需求日历</span></div>
<div class="rf-toolbar"><div class="rf-title-group"><h2 class="rf-title-heading"><button type="button" id="rf-title" class="rf-month-jump" aria-label="跳转月份" aria-haspopup="dialog" aria-controls="rf-month-picker" aria-expanded="false" aria-live="polite"></button></h2><button id="rf-view" type="button" class="rf-view" aria-label="打开需求汇总" aria-pressed="false" title="需求汇总"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/></svg></button></div></div>
<p id="rf-reminder-status" class="rf-reminder-status" role="status" hidden></p>
<div id="rf-export-status" class="rf-export-status" role="status" hidden><span id="rf-export-message"></span><button type="button" id="rf-export-dismiss" class="rf-close" aria-label="关闭导出提示"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8"/></svg></button></div>
<p id="rf-storage-error" class="rf-storage-error" role="alert" hidden></p>
<div class="rf-content"><main id="rf-calendar" class="rf-calendar" aria-label="需求与阶段日历"></main><main id="rf-summary" class="rf-summary" aria-label="需求汇总" hidden></main><aside id="rf-detail" class="rf-detail" aria-label="需求详情" hidden><div class="rf-detail-head"><span id="rf-panel-label" class="rf-muted">需求详情</span><button type="button" class="rf-close cursor-interaction" id="rf-close" aria-label="关闭详情"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8"/></svg></button></div><div id="rf-panel"></div></aside></div>
<span id="rf-feedback" class="rf-feedback" aria-live="polite"></span>
<div id="rf-toast" class="rf-toast" role="status" hidden><span id="rf-toast-text"></span><button id="rf-undo" type="button">撤销删除</button></div>
<dialog id="rf-discard" class="rf-dialog" aria-labelledby="rf-discard-title"><h2 id="rf-discard-title">保存对需求的更改？</h2><p>未保存的更改会在离开编辑器后丢失。</p><div class="rf-dialog-actions"><button id="rf-discard-drop" type="button">不保存</button><button id="rf-discard-keep" type="button" autofocus>继续编辑</button><button id="rf-discard-save" type="button">保存</button></div></dialog>

<dialog id="rf-month-picker" class="rf-month-picker" aria-labelledby="rf-month-picker-title">
  <form id="rf-month-form" novalidate>
    <div class="rf-heading"><h3 id="rf-month-picker-title">跳转月份</h3><button type="button" id="rf-month-cancel" class="rf-close" aria-label="关闭月份选择"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8"/></svg></button></div>
    <div class="rf-pair"><label class="rf-field"><span>年份</span><input id="rf-month-year" type="number" min="1" max="9999" step="1" required inputmode="numeric"></label><label class="rf-field"><span>月份</span><select id="rf-month-number" required></select></label></div>
    <p id="rf-month-error" class="rf-error" role="alert"></p>
    <div class="rf-month-actions"><button type="button" id="rf-month-current" class="rf-text-button">回到本月</button><button type="submit" class="rf-button rf-primary" id="rf-month-go">跳转</button></div>
  </form>
</dialog>
<input type="file" id="rf-json-file" accept=".json,application/json" hidden>
<dialog id="rf-import-picker" class="rf-month-picker rf-import-picker" aria-labelledby="rf-import-title">
 <form id="rf-import-form">
  <h3 id="rf-import-title">导入需求 JSON</h3>
  <label class="rf-field"><span>导入方式</span><select id="rf-import-mode"><option value="merge">合并：重复 ID 跳过</option><option value="update">合并：重复 ID 更新</option><option value="copy">全部作为新需求添加</option><option value="replace">恢复备份：替换全部需求</option></select></label>
  <p id="rf-import-summary" role="status"></p><p id="rf-import-error" class="rf-error" role="alert"></p>
  <div class="rf-month-actions"><button type="button" id="rf-import-cancel" class="rf-button">取消</button><button type="submit" id="rf-import-go" class="rf-button rf-primary">确认导入</button></div>
 </form>
</dialog>
</div>

<script src="model.js"></script>
<script src="planning.js"></script>
<script src="commands.js"></script>
<script src="storage.js"></script>
<script src="icons.js"></script>
<script src="site-icons.js"></script>
<script src="disclosure.js"></script>
<script src="startup.js"></script>
<script src="app.js"></script>
</body>
</html>
