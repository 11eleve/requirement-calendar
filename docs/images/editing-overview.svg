<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title"><title id="title">需求日历 · 编辑与资料管理功能示意</title><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="650" rx="0" fill="#f8f7fc"/><text x="48" y="46" font-size="12" fill="#655b9a" font-weight="500" text-anchor="start">REQUIREMENT CALENDAR</text><text x="48" y="87" font-size="30" fill="#292c3b" font-weight="500" text-anchor="start">编辑资料时，排期始终可见</text><text x="48" y="117" font-size="16" fill="#7b7d8c" font-weight="400" text-anchor="start">日期变了，范围条同步变化；保存后接替为正式需求。</text><rect x="48" y="152" width="660" height="420" rx="16" fill="#ffffff" stroke="#e5e5ed"/><text x="72" y="188" font-size="18" fill="#292c3b" font-weight="500" text-anchor="start">日历中的排期范围</text><text x="72" y="214" font-size="14" fill="#7b7d8c" font-weight="400" text-anchor="start">点击或拖动创建后，彩色条持续保留</text><text x="116" y="257" font-size="13" fill="#7b7d8c" font-weight="400" text-anchor="middle">10.7</text><text x="204" y="257" font-size="13" fill="#7b7d8c" font-weight="400" text-anchor="middle">10.8</text><path d="M160,236 L160,398" stroke="#e5e5ed" fill="none"/><text x="292" y="257" font-size="13" fill="#7b7d8c" font-weight="400" text-anchor="middle">10.9</text><path d="M248,236 L248,398" stroke="#e5e5ed" fill="none"/><text x="380" y="257" font-size="13" fill="#7b7d8c" font-weight="400" text-anchor="middle">10.10</text><path d="M336,236 L336,398" stroke="#e5e5ed" fill="none"/><text x="468" y="257" font-size="13" fill="#7b7d8c" font-weight="400" text-anchor="middle">10.11</text><path d="M424,236 L424,398" stroke="#e5e5ed" fill="none"/><text x="556" y="257" font-size="13" fill="#7b7d8c" font-weight="400" text-anchor="middle">10.12</text><path d="M512,236 L512,398" stroke="#e5e5ed" fill="none"/><text x="644" y="257" font-size="13" fill="#7b7d8c" font-weight="400" text-anchor="middle">10.13</text><path d="M600,236 L600,398" stroke="#e5e5ed" fill="none"/><rect x="76" y="278" width="608" height="53" rx="7" fill="#eeebf8"/><text x="89" y="299" font-size="14" fill="#655b9a" font-weight="500" text-anchor="start">结算流程改版</text><text x="89" y="320" font-size="12" fill="#655b9a" font-weight="400" text-anchor="start">评审</text><text x="284" y="320" font-size="12" fill="#655b9a" font-weight="400" text-anchor="start">开发</text><rect x="76" y="370" width="608" height="14" rx="5" fill="#aaa0d2"/><text x="72" y="430" font-size="17" fill="#655b9a" font-weight="500" text-anchor="start">编辑中的范围条</text><text x="72" y="458" font-size="15" fill="#7b7d8c" font-weight="400" text-anchor="start">起止日期调整 → 日历范围同步</text><text x="72" y="493" font-size="15" fill="#7b7d8c" font-weight="400" text-anchor="start">取消 / 关闭 → 移除预览</text><text x="72" y="528" font-size="15" fill="#7b7d8c" font-weight="400" text-anchor="start">保存 → 显示正式需求与阶段</text><rect x="740" y="152" width="412" height="420" rx="16" fill="#ffffff" stroke="#e5e5ed"/><text x="764" y="187" font-size="18" fill="#292c3b" font-weight="500" text-anchor="start">编辑需求</text><rect x="764" y="205" width="364" height="34" rx="7" fill="#f5f4f9"/><rect x="767" y="208" width="178" height="28" rx="5" fill="#eeebf8"/><text x="856" y="228" font-size="13" fill="#655b9a" font-weight="500" text-anchor="middle">基本信息</text><text x="1036" y="228" font-size="13" fill="#7b7d8c" font-weight="400" text-anchor="middle">阶段</text><text x="764" y="268" font-size="12" fill="#7b7d8c" font-weight="400" text-anchor="start">需求名称</text><rect x="764" y="278" width="364" height="34" rx="6" fill="#fafafd" stroke="#e5e5ed"/><text x="775" y="301" font-size="14" fill="#292c3b" font-weight="400" text-anchor="start">结算流程改版</text><text x="764" y="340" font-size="12" fill="#7b7d8c" font-weight="400" text-anchor="start">开始日期</text><text x="954" y="340" font-size="12" fill="#7b7d8c" font-weight="400" text-anchor="start">结束日期</text><rect x="764" y="350" width="174" height="34" rx="6" fill="#fafafd" stroke="#e5e5ed"/><rect x="954" y="350" width="174" height="34" rx="6" fill="#fafafd" stroke="#e5e5ed"/><text x="775" y="373" font-size="13" fill="#292c3b" font-weight="400" text-anchor="start">2026-10-07</text><text x="965" y="373" font-size="13" fill="#292c3b" font-weight="400" text-anchor="start">2026-10-13</text><text x="764" y="416" font-size="14" fill="#292c3b" font-weight="500" text-anchor="start">相关资料</text><text x="1128" y="416" font-size="12" fill="#7b7d8c" font-weight="400" text-anchor="end">自定义名称与类型</text><path d="M764,431 L1128,431" stroke="#e5e5ed" fill="none"/><text x="775" y="458" font-size="13" fill="#292c3b" font-weight="400" text-anchor="start">结算改版 PRD</text><text x="1118" y="458" font-size="12" fill="#7b7d8c" font-weight="400" text-anchor="end">需求文档</text><path d="M764,472 L1128,472" stroke="#e5e5ed" fill="none"/><text x="775" y="497" font-size="13" fill="#292c3b" font-weight="400" text-anchor="start">支付接口约定</text><text x="1118" y="497" font-size="12" fill="#7b7d8c" font-weight="400" text-anchor="end">接口</text><rect x="1026" y="523" width="102" height="32" rx="7" fill="#655b9a"/><text x="1077" y="545" font-size="13" fill="#ffffff" font-weight="500" text-anchor="middle">保存需求</text><text x="991" y="545" font-size="13" fill="#7b7d8c" font-weight="400" text-anchor="end">取消</text><text x="48" y="614" font-size="13" fill="#7b7d8c" font-weight="400" text-anchor="start">编辑与资料管理 · 功能示意，非运行截图</text></g></svg>