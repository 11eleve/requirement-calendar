name: Windows desktop

on:
  push:
    branches: [main, 'explore/**']
    paths: ['src/**', 'index.html', 'scripts/**', 'desktop/**', 'tests/**', 'assets/app-icon.png', 'package*.json', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['src/**', 'index.html', 'scripts/**', 'desktop/**', 'tests/**', 'assets/app-icon.png', 'package*.json', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:ai
      - name: Validate Windows reminder adapter
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/desktop/electron/windows-reminders.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $null = [Windows.UI.Notifications.ScheduledToastNotification, Windows.UI.Notifications, ContentType = WindowsRuntime]
      - name: Exercise Windows desktop bridge
        run: npm run test:desktop
        env:
          CALENDAR_SMOKE_OUTPUT: desktop-smoke-windows.json
      - name: Exercise AI conversation through the real desktop UI
        run: npm run test:ai:desktop
      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Exercise packaged application
        shell: powershell
        run: |
          $env:CALENDAR_SMOKE_OUTPUT = "$pwd/packaged-smoke-windows.json"
          $process = Start-Process -FilePath "$pwd/dist/windows/win-unpacked/RequirementCalendar.exe" -ArgumentList '--calendar-smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }
          if (!(Test-Path $env:CALENDAR_SMOKE_OUTPUT)) { throw 'Missing smoke test report' }
      - name: Install and exercise application
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'RequirementCalendar'
          $installer = (Get-ChildItem dist/windows/*Setup.exe).FullName
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $command = (Get-Item 'HKCU:\Software\Classes\requirement-calendar\shell\open\command').GetValue('')
          $expected = '"' + $installDir + '\RequirementCalendar.exe" "%1"'
          if ($command -ne $expected) { throw "Protocol registration mismatch: $command" }
          if (!(Test-Path "$env:APPDATA/Microsoft/Windows/Start Menu/Programs/需求日历.lnk")) { throw 'Missing Start menu shortcut' }
          $env:CALENDAR_SMOKE_OUTPUT = "$pwd/installed-smoke-windows.json"
          $process = Start-Process -FilePath "$installDir/RequirementCalendar.exe" -ArgumentList '--calendar-smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $env:CALENDAR_SMOKE_OUTPUT)) { throw 'Installed app smoke test failed' }
          if (!(Test-Path "$installDir/reqcal.exe")) { throw 'Missing installed reqcal.exe' }
          $pathEntries = [Environment]::GetEnvironmentVariable('Path','User') -split ';'
          if ($pathEntries -inotcontains $installDir) { throw 'Installer did not add reqcal to user PATH' }
          $env:Path += ";$installDir"
          if ((Get-Command reqcal.exe).Source -ine "$installDir\reqcal.exe") { throw 'Installed reqcal command not found' }
          node tests/windows/cli-installed.cjs "$installDir/RequirementCalendar.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI test failed' }
          $env:CALENDAR_ELECTRON_EXE = "$installDir/RequirementCalendar.exe"
          $env:CALENDAR_AI_REPORT = "$pwd/installed-ai-windows.json"
          node tests/e2e/assistant-electron.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed AI test failed' }
      - name: Uninstall and preserve unrelated PATH entries
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'RequirementCalendar'
          $before = @([Environment]::GetEnvironmentVariable('Path','User') -split ';' | Where-Object { $_ -ine $installDir -and $_ -ne '' })
          $uninstaller = (Get-ChildItem "$installDir/Uninstall*.exe").FullName
          $process = Start-Process -FilePath $uninstaller -ArgumentList @('/S',"_?=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstaller failed' }
          $after = @([Environment]::GetEnvironmentVariable('Path','User') -split ';' | Where-Object { $_ -ne '' })
          if ($after -icontains $installDir -or (Compare-Object $before $after)) { throw 'Uninstaller altered unrelated PATH entries' }
      - name: Installer checksum
        shell: powershell
        run: |
          Get-ChildItem dist/windows/*Setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Upload AI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AI-failure-diagnostics
          path: |
            .build/assistant-*.png
            assistant-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: RequirementCalendar-Windows-x64
          path: |
            dist/windows/*Setup.exe
            dist/windows/*.sha256
            desktop-smoke-windows.json
            packaged-smoke-windows.json
            installed-smoke-windows.json
            installed-cli-windows.json
            installed-ai-windows.json
          if-no-files-found: error
          retention-days: 30
